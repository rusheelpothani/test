<!DOCTYPE html>
<html>
<head>
  <title>Investigation Report Form</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.3.2/docx.min.js"></script>
</head>
<body>
  <h2>Investigation Report Form</h2>
  <form id="reportForm">
    <label>Claim No:</label>
    <input type="text" id="claimNo" required><br><br>
    <label>Case Title:</label>
    <input type="text" id="caseTitle" required><br><br>
    <label>Accident Date:</label>
    <input type="date" id="accidentDate" required><br><br>
    <label>Accident Place:</label>
    <input type="text" id="accidentPlace" required><br><br>
    <label>Injured Name:</label>
    <input type="text" id="injuredName" required><br><br>
    <button type="submit">Generate Report</button>
  </form>

  <script>
    document.getElementById("reportForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell } = docx;

      const doc = new Document({
        sections: [{
          children: [
            new Paragraph({ children: [new TextRun({ text: "WITHOUT PREJUDICE", bold: true })] }),
            new Paragraph("Date: " + new Date().toLocaleDateString()),
            new Paragraph("Subject: INVESTIGATION REPORT"),
            new Paragraph("Claim No: " + document.getElementById("claimNo").value),
            new Paragraph("Case Title: " + document.getElementById("caseTitle").value),

            new Paragraph({ text: "ACCIDENT DETAILS", bold: true }),
            new Table({
              rows: [
                new TableRow({
                  children: [
                    new TableCell({ children: [new Paragraph("Date of Accident")] }),
                    new TableCell({ children: [new Paragraph(document.getElementById("accidentDate").value)] })
                  ]
                }),
                new TableRow({
                  children: [
                    new TableCell({ children: [new Paragraph("Place of Accident")] }),
                    new TableCell({ children: [new Paragraph(document.getElementById("accidentPlace").value)] })
                  ]
                }),
                new TableRow({
                  children: [
                    new TableCell({ children: [new Paragraph("Injured Person")] }),
                    new TableCell({ children: [new Paragraph(document.getElementById("injuredName").value)] })
                  ]
                })
              ]
            }),

            new Paragraph({ text: "Findings / Observations:", bold: true }),
            new Paragraph("• Accident allegedly occurred as per FIR details."),
            new Paragraph("• Police charge sheet attributes rash and negligent driving."),
            new Paragraph("• Contestable Ground: NO DL"),
          ]
        }]
      });

      const blob = await Packer.toBlob(doc);
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "InvestigationReport.docx";
      link.click();
    });
  </script>
</body>
</html>
